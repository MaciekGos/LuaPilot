<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuaPilot</title><link rel="stylesheet" href="popup.css"></head>
<body>
<main id="app" data-power="on" data-link="on" data-conn="off">
  <header><img class="wide" src="../icons/logo-wide-white.png" alt="LuaPilot"></header>

  <section class="hero">
    <div class="orb" aria-hidden="true"><span class="ring r1"></span><span class="ring r2"></span><img src="../icons/logo-mark.png" alt=""></div>
    <h1 id="headline">Connected</h1>
    <p id="sub">Ready to work in Roblox Studio</p>
  </section>

  <section class="rows">
    <div class="row"><div class="ric" data-i="power"></div><div class="rt"><b>LuaPilot</b><small>Master switch. Off = the AI chat is left alone.</small></div>
      <button id="power" class="switch" role="switch" aria-checked="true" aria-label="LuaPilot on or off"><i></i></button></div>
    <div class="row"><div class="ric" data-i="plugs-connected"></div><div class="rt"><b>Bridge connection</b><small id="bridgeTxt">ws://127.0.0.1:17613</small></div>
      <button id="link" class="pill">Disconnect</button></div>
    <div class="chips">
      <span class="chip" id="cBridge"><i></i>Bridge</span>
      <span class="chip" id="cMcp"><i></i>Studio MCP</span>
      <span class="chip" id="cPlace"><i></i>Place open</span>
    </div>
  </section>

  <footer>Start the LuaPilot app first. <span>Not affiliated with DeepSeek or Roblox.</span></footer>
</main>
<script src="icons.js"></script>
<script src="popup.js"></script>
</body></html>
